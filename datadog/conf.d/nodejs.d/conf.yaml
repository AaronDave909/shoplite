# Datadog Agent log collection for ShopLite.
#
# Native macOS Agent: copy this folder to
#   /opt/datadog-agent/etc/conf.d/nodejs.d/conf.yaml
# and replace the path below with the absolute path of logs/shoplite.log.
# Also set `logs_enabled: true` in /opt/datadog-agent/etc/datadog.yaml.
#
# docker-compose mounts this file and the logs folder at /app/logs automatically.
logs:
  - type: file
    path: /app/logs/shoplite.log
    service: shoplite
    source: nodejs

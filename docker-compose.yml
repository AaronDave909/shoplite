# Runs the Datadog Agent (and optionally the app) in containers.
# In GitHub Codespaces, .devcontainer/start-agent.sh starts only `datadog-agent`;
# the app runs with `npm start` and reaches the Agent on localhost:8126.
# DD_API_KEY / DD_SITE come from the shell environment (Codespaces secrets),
# falling back to values in .env for local Docker use.
services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY:?Set DD_API_KEY (Codespaces secret or .env)}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: sandbox
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_HOSTNAME: shoplite-sandbox
    volumes:
      - ./datadog/conf.d/nodejs.d:/conf.d/nodejs.d:ro
      - ./logs:/app/logs:ro
    ports:
      - "8126:8126"

  shoplite:
    build: .
    env_file: .env
    environment:
      DD_AGENT_HOST: datadog-agent
      LOG_FILE: /app/logs/shoplite.log
    volumes:
      - ./logs:/app/logs
    ports:
      - "3000:3000"
    depends_on:
      - datadog-agent
